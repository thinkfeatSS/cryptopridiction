events {
    worker_connections 20480;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 10k Concurrency Microcache Zone for API Read Endpoints
    proxy_cache_path /var/cache/nginx/api_cache levels=1:2 keys_zone=api_cache:20m max_size=512m inactive=60m use_temp_path=off;

    # =========================================================================
    # SpeakUpMic Services (Existing)
    # =========================================================================
    upstream fastapi_service {
        server fastapi:8000;
        keepalive 32;
    }

    upstream nestjs_service {
        server api:3000;
        keepalive 32;
    }

    # =========================================================================
    # BullsAndBears Crypto Platform Services (10k User Scaled)
    # =========================================================================
    upstream crypto_backend_upstream {
        server crypto_backend:8000;
        keepalive 64;
    }

    upstream crypto_frontend_upstream {
        server crypto_frontend:3000;
        keepalive 64;
    }

    # -------------------------------------------------------------------------
    # 1. SpeakUpMic — HTTP -> HTTPS
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name speakupmic.binaryunit.tech 187.52.116.72 localhost _ *.hostingersite.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        location /health {
            proxy_pass http://nestjs_service/api/v1/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # 2. SpeakUpMic — HTTPS (Port 443)
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name speakupmic.binaryunit.tech;

        ssl_certificate /etc/letsencrypt/live/speakupmic.binaryunit.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/speakupmic.binaryunit.tech/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        location /health {
            proxy_pass http://nestjs_service/api/v1/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/speech {
            proxy_pass http://fastapi_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        location /api/v1/sessions {
            proxy_pass http://fastapi_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        location /api/v1/benchmark {
            proxy_pass http://fastapi_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://nestjs_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # -------------------------------------------------------------------------
    # 3. BullsAndBears Crypto Platform — HTTP -> HTTPS
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name bullsandbears.binaryunit.tech;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # 4. BullsAndBears Crypto Platform — HTTPS (Port 443)
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name bullsandbears.binaryunit.tech;

        ssl_certificate /etc/letsencrypt/live/bullsandbears.binaryunit.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bullsandbears.binaryunit.tech/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Crypto Backend API Endpoints (with High-Concurrency Microcaching for 10k Users)
        location /api/ {
            proxy_pass http://crypto_backend_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;

            # High-Throughput 3s microcache for 10,000 concurrent user scaling
            proxy_cache api_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 3s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 2s;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # Crypto Backend Swagger & Redoc Documentation
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://crypto_backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Next.js Static Optimization Cache
        location /_next/static/ {
            proxy_pass http://crypto_frontend_upstream/_next/static/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Next.js Frontend Web App
        location / {
            proxy_pass http://crypto_frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
        }
    }
}
